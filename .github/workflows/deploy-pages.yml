name: Deploy web app to GitHub Pages

# Builds the Vite app in pyjhora-web/ and publishes it to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'pyjhora-web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Allow this workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pyjhora-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pyjhora-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Uses `vite build` (not `npm run build`) because the repo's `tsc -b`
        # step currently has many pre-existing type errors in tests/components;
        # the deployed bundle is produced by Vite/esbuild regardless.
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pyjhora-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
